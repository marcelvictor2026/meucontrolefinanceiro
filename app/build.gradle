plugins { id 'com.android.application' }
android {
 namespace 'br.com.meucontrolefinanceiro'
 compileSdk 35
 defaultConfig {
  applicationId 'br.com.meucontrolefinanceiro'
  minSdk 26
  targetSdk 35
  versionCode 14
  versionName '1.7.3'
 }
 signingConfigs {
  release {
   if (System.getenv('ANDROID_SIGNING_KEYSTORE')) {
    storeFile file(System.getenv('ANDROID_SIGNING_KEYSTORE'))
    storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
    keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  release {
   signingConfig signingConfigs.release
   minifyEnabled false
  }
 }
}
